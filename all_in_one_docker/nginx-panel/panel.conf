server {
    server_name <YOUR-PANEL-DOMAIN> default_server;

    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate "/etc/letsencrypt/live/<YOUR-PANEL-DOMAIN>/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/<YOUR-PANEL-DOMAIN>/privkey.pem";
    ssl_trusted_certificate "/etc/letsencrypt/live/<YOUR-PANEL-DOMAIN>/fullchain.pem";

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/gzip.conf;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name <YOUR-PAGE-DOMAIN>;

    ssl_certificate "/etc/letsencrypt/live/<YOUR-PAGE-DOMAIN>/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/<YOUR-PAGE-DOMAIN>/privkey.pem";
    ssl_trusted_certificate "/etc/letsencrypt/live/<YOUR-PAGE-DOMAIN>/fullchain.pem";

    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://$host$request_uri;
}

server {
    listen unix://run/nginx/subscription.sock proxy_protocol default_server;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    http2 on;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    include /etc/nginx/snippets/gzip.conf;
}
